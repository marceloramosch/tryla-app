  body{

    overscroll-behavior-y:none;
  }

  /* ================= App shell (iOS-style) ================= */
  #app{ display:flex; flex-direction:column; height:100dvh; }

  .ios-nav{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px;
    background:linear-gradient(165deg,#06070A 0%,#06038D 160%);

  .ios-nav .mark{ width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#5B54FF,#3B36D6);display:flex;align-items:center;justify-content:center;flex-shrink:0; }
  .ios-nav .word{ font-family:'Unbounded',Arial,sans-serif; font-weight:800; font-size:15px; color:#fff; letter-spacing:-0.2px; }
  .ios-nav .client-name{ font-size:11px; color:#C9C6FF; font-weight:600; }
  .ios-nav a.site-link{ font:700 12px/1 'Sora',Arial,sans-serif; color:#fff; text-decoration:none; border:1.5px solid rgba(255,255,255,.3); padding:8px 12px; border-radius:20px; }

  .ios-screens{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; background:#F2F1F8; }
  .ios-screen{ display:none; padding:18px 16px calc(28px + env(safe-area-inset-bottom,0px)); max-width:640px; margin:0 auto; }
  .ios-screen.active{ display:block; animation:screenIn .28s cubic-bezier(.22,.61,.36,1); }
  @keyframes screenIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  @media(prefers-reduced-motion:reduce){ .ios-screen.active{ animation:none; } }

  .ios-tabbar{
    flex:0 0 auto; display:flex; background:rgba(255,255,255,.86); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-top:1px solid rgba(0,0,0,.08); padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  }
  .ios-tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px;
    background:none; border:none; color:#8B87A6; font:600 10px/1.1 'Sora',Arial,sans-serif; cursor:pointer;
  }
  .ios-tab svg{ width:23px; height:23px; stroke:#8B87A6; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transition:stroke .15s ease, transform .15s ease; }
  .ios-tab.active{ color:#5B54FF; }
  .ios-tab.active svg{ stroke:#5B54FF; transform:translateY(-1px) scale(1.06); }
  .ios-tab .dot{ position:absolute; margin-top:-24px; margin-left:14px; width:7px; height:7px; border-radius:50%; background:#E0A94C; border:1.5px solid #fff; }

  .btn.outline{ background:#F1F0FF; color:#5B54FF; }
  .msg{ font-size:12.5px; color:#1CAD5A; font-weight:700; margin-top:10px; display:block; }

  .landing .actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .landing .btn2{ font:700 14px/1 Arial,sans-serif; padding:13px 22px; border-radius:9px; text-decoration:none; display:inline-flex; align-items:center; gap:8px; }

  .landing .btn2.outline{ background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.35); }
  .landing .fine{ margin-top:40px; font-size:12px; color:#7c76a8; }
  .full-loading, .full-error{ color:#C9C6FF; text-align:center; padding:100px 20px; font-size:14px; }

  .thumb{ display:inline-flex; align-items:center; gap:8px; margin-top:8px; font-size:11.5px; color:#5b6b8c; }

  .gallery-preview{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }

  .li-score-num{ font-family:'Unbounded',Arial,sans-serif; font-weight:800; font-size:34px; margin:6px 0 2px; }
  .li-score-sub{ font-size:12.5px; opacity:.9; }
  .li-metric{ margin-bottom:12px; }

  .li-bar{ height:6px; border-radius:4px; background:#EEEDF9; overflow:hidden; }
  .li-bar span{ display:block; height:100%; background:linear-gradient(90deg,#5B54FF,#8B86FF); border-radius:4px; transition:width .5s ease; }
  .li-insight{ font-size:13px; color:#3d3a5c; padding:8px 0; border-top:1px solid #EEEDF9; line-height:1.5; }

  .stub{ text-align:center; padding:36px 10px; }
  .stub .stub-icon{ width:64px; height:64px; border-radius:18px; background:linear-gradient(135deg,#5B54FF,#3B36D6); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }

  .stub .soon-pill{ display:inline-block; margin-top:16px; font:700 10.5px/1 'Sora',Arial,sans-serif; letter-spacing:1px; text-transform:uppercase; color:#5B54FF; background:#F1F0FF; padding:7px 14px; border-radius:999px; }

  /* ---- Operator: cobros, plataformas de delivery, pedidos ---- */
  .op-card-row{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #F0EFFA; }
  .op-card-row:last-child{ border-bottom:none; }
  .op-badge{ width:46px; height:46px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff; font:800 8.5px/1.15 'Sora',Arial,sans-serif; text-align:center; letter-spacing:-.1px; white-space:pre-line; }
  .op-row-body{ flex:1; min-width:0; }
  .op-row-body h3{ font:700 14px/1.3 'Sora',Arial,sans-serif; color:#171433; margin:0 0 2px; }
  .op-row-body p{ font-size:11.5px; color:#7c8aa6; margin:0; line-height:1.4; }
  .op-connect-btn{ font:700 12.5px/1 'Sora',Arial,sans-serif; padding:10px 14px; border-radius:9px; white-space:nowrap; text-decoration:none; flex-shrink:0; border:none; cursor:pointer; }
  .op-connect-btn.primary{ background:#5B54FF; color:#fff; }
  .op-connect-btn.ghost{ background:#F1F0FF; color:#5B54FF; }
  .op-connected{ display:flex; align-items:center; gap:6px; font:700 12.5px 'Sora',Arial,sans-serif; color:#1CAD5A; flex-shrink:0; }

  .op-orders{ display:flex; flex-direction:column; gap:12px; }
  .op-order{ background:#fff; border-radius:14px; padding:16px; box-shadow:0 1px 2px rgba(20,16,50,.05); border-left:4px solid #5B54FF; }
  .op-order.status-listo{ border-left-color:#1CAD5A; }
  .op-order.status-completado{ border-left-color:#C9C6D9; opacity:.65; }
  .op-order.status-cancelado{ border-left-color:#C0392B; opacity:.55; }
  .op-order-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; }
  .op-order-name{ font:700 14.5px 'Sora',Arial,sans-serif; color:#171433; }
  .op-order-time{ font-size:11px; color:#9aa3bf; margin-top:1px; }
  .op-status-label{ font:700 10.5px 'Sora',Arial,sans-serif; color:#8B87A6; text-transform:uppercase; letter-spacing:.5px; flex-shrink:0; }
  .op-fulfill-pill{ display:inline-block; font:700 10.5px/1 'Sora',Arial,sans-serif; padding:5px 10px; border-radius:999px; background:#F1F0FF; color:#5B54FF; margin-bottom:9px; }
  .op-order-items{ font-size:12.5px; color:#5b6b8c; line-height:1.6; margin-bottom:8px; }
  .op-order-total{ font:800 16px/1 'Unbounded',Arial,sans-serif; color:#171433; margin-bottom:12px; }
  .op-order-actions{ display:flex; gap:8px; }
  .op-btn-next{ flex:1; font:700 13px/1 'Sora',Arial,sans-serif; padding:13px; border-radius:10px; border:none; background:#5B54FF; color:#fff; cursor:pointer; }
  .op-btn-cancel{ flex:0 0 auto; font:700 13px/1 'Sora',Arial,sans-serif; padding:13px 16px; border-radius:10px; border:none; background:#FBEAEA; color:#C0392B; cursor:pointer; }
  .op-btn-next:active, .op-btn-cancel:active{ transform:scale(.98); }
</style>

      "</button>"
    );
  }).join("");
  document.getElementById("app").appendChild(tabbar);

  tabbar.addEventListener("click", function (e) {
    var btn = e.target.closest(".ios-tab");
    if (!btn) return;
    tabbar.querySelectorAll(".ios-tab").forEach(function (b) { b.classList.toggle("active", b === btn); });
    document.querySelectorAll(".ios-screen").forEach(function (s) {
      s.classList.toggle("active", s.id === "screen-" + btn.dataset.tab);
    });
  });

  // ---- Location Intelligence wiring ----
  var TLI = window.TrylaLocationIntel;
  document.getElementById("liAnalyzeBtn").addEventListener("click", async function () {
    var address = document.getElementById("liAddress").value.trim();
    if (!address) { document.getElementById("liAddress").focus(); return; }
    var cuisine = document.getElementById("liCuisine").value;
    var r = TLI.scoreFor(address, cuisine);
    var t = TLI.tier(r.overall10);
    document.getElementById("liScoreNum").textContent = r.overall10.toFixed(1) + " / 10";
    document.getElementById("liScoreSub").textContent = t.label;
    document.getElementById("liMetricTraffic").textContent = r.traffic;
    document.getElementById("liMetricComp").textContent = r.space;
    document.getElementById("liMetricDemo").textContent = r.demo;
    document.getElementById("liMetricGap").textContent = r.gap;
    document.getElementById("liBarTraffic").style.width = r.traffic + "%";
    document.getElementById("liBarComp").style.width = r.space + "%";
    document.getElementById("liBarDemo").style.width = r.demo + "%";
    document.getElementById("liBarGap").style.width = r.gap + "%";
    var insightsEl = document.getElementById("liInsights");
    insightsEl.innerHTML = "";
    TLI.insightsFor(r, cuisine).forEach(function (text) {
      var div = document.createElement("div");
      div.className = "li-insight";
      div.textContent = text;
      insightsEl.appendChild(div);
    });
    document.getElementById("liResultCard").style.display = "block";
    var point = await TLI.geocode(address);
    if (point) {
      try {
        await TLI.mountMap(document.getElementById("liMap"), point, r);
      } catch (mmErr) {
        console.warn("No se pudo cargar el mapa:", mmErr);
      }
    }
  });

  // ---- Web Builder (Mi Sitio) ----
  function menuRowHtml(item) {
    item = item || {};
    return (
      '<div class="menu-row">' +
      '<input type="text" class="menu-name" placeholder="Platillo" value="' + esc(item.name) + '">' +
      '<input type="text" class="menu-price" placeholder="Precio" value="' + esc(item.price) + '">' +
      '<input type="text" class="menu-desc" placeholder="Descripción (opcional)" value="' + esc(item.desc) + '">' +
      '<button type="button" data-rm-row aria-label="Quitar">&times;</button>' +
      "</div>"
    );
  }
  function readMenuRows(el) {
    var rows = [];
    el.querySelectorAll(".menu-row").forEach(function (row) {
      var name = row.querySelector(".menu-name").value.trim();
      var price = row.querySelector(".menu-price").value.trim();
      var desc = row.querySelector(".menu-desc").value.trim();
      if (name || price || desc) rows.push({ name: name, price: price, desc: desc });
    });
    return rows;
  }
  function uploadPath(file) {
    var ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
    return token.slice(0, 10) + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
  }
  async function uploadImage(file) {
    var path = uploadPath(file);
    var res = await sb.storage.from("site-images").upload(path, file, { upsert: true, cacheControl: "3600", contentType: file.type || undefined });
    if (res.error) throw res.error;
    return sb.storage.from("site-images").getPublicUrl(path).data.publicUrl;
  }

  function renderSite(site) {
    site = site || {};
    var gallery = Array.isArray(site.gallery) ? site.gallery : [];
    var menu = Array.isArray(site.menu) ? site.menu : [];
    var siteRoot = document.getElementById("siteRoot");

    document.getElementById("navClientName").textContent = site.restaurant_name || "";

    siteRoot.innerHTML =
      '<div class="card">' +
        "<h2>Bienvenido" + (site.restaurant_name ? ", " + esc(site.restaurant_name) : "") + "</h2>" +
        '<div class="hint">Edita lo que quieras y da clic en Guardar — se actualiza al instante.' +
        (site.subdomain ? ' Tu sitio: <a class="live-link" href="https://' + esc(site.subdomain) + '.thetryla.com" target="_blank">' + esc(site.subdomain) + ".thetryla.com</a>" : "") +
        "</div>" +
        '<div class="field"><label>Nombre del restaurante</label><input type="text" id="pvName" value="' + esc(site.restaurant_name) + '"></div>' +
        '<div class="field"><label>Eslogan</label><input type="text" id="pvTagline" value="' + esc(site.tagline) + '"></div>' +
        '<div class="field"><label>Descripción</label><textarea id="pvDescription" rows="3">' + esc(site.description) + "</textarea></div>" +
      "</div>" +

      '<div class="card">' +
        "<h2>Fotos</h2>" +
        '<div class="field"><label>Logo</label><input type="file" id="pvLogoFile" accept="image/*">' +
          (site.logo_url ? '<div class="thumb"><img src="' + esc(site.logo_url) + '"> actual</div>' : "") +
        "</div>" +
        '<div class="field"><label>Foto principal (hero)</label><input type="file" id="pvHeroFile" accept="image/*">' +
          (site.hero_image_url ? '<div class="thumb"><img src="' + esc(site.hero_image_url) + '"> actual</div>' : "") +
        "</div>" +
        '<div class="field"><label>Galería (puedes elegir varias)</label><input type="file" id="pvGalleryFile" accept="image/*" multiple>' +
          (gallery.length ? '<div class="gallery-preview">' + gallery.map(function (u) { return '<img src="' + esc(u) + '">'; }).join("") + "</div>" : "") +
        "</div>" +
      "</div>" +

      '<div class="card">' +
        "<h2>Menú</h2>" +
        '<div id="pvMenuRows">' + (menu.length ? menu.map(menuRowHtml).join("") : menuRowHtml()) + "</div>" +
        '<button type="button" class="add-row" id="pvAddMenuRow">+ Agregar platillo</button>' +
      "</div>" +

      '<div class="card">' +
        "<h2>Contacto</h2>" +
        '<div class="row">' +
          '<div class="field"><label>Teléfono</label><input type="text" id="pvPhone" value="' + esc(site.phone) + '"></div>' +
          '<div class="field"><label>Correo</label><input type="email" id="pvEmail" value="' + esc(site.email) + '"></div>' +
        "</div>" +
        '<div class="row">' +
          '<div class="field"><label>Dirección / ubicación</label><input type="text" id="pvAddress" value="' + esc(site.address) + '"></div>' +
          '<div class="field"><label>Horario</label><input type="text" id="pvHours" value="' + esc(site.hours) + '"></div>' +
        "</div>" +
        '<div class="row">' +
          '<div class="field"><label>Instagram</label><input type="text" id="pvInstagram" value="' + esc(site.instagram) + '"></div>' +
          '<div class="field"><label>Facebook</label><input type="text" id="pvFacebook" value="' + esc(site.facebook) + '"></div>' +
          '<div class="field"><label>TikTok</label><input type="text" id="pvTiktok" value="' + esc(site.tiktok) + '"></div>' +
        "</div>" +
      "</div>" +

      '<div class="card">' +
        '<div class="publish"><input type="checkbox" id="pvPublished"' + (site.published ? " checked" : "") + "> <label for=\"pvPublished\">Publicado (visible al público)</label></div>" +
        '<button type="button" class="btn" id="pvSaveBtn">Guardar cambios</button>' +
        '<span class="msg" id="pvMsg"></span>' +
      "</div>";

    var newLogoUrl = site.logo_url || null;
    var newHeroUrl = site.hero_image_url || null;
    var newGallery = gallery.slice();

    document.getElementById("pvAddMenuRow").addEventListener("click", function () {
      document.getElementById("pvMenuRows").insertAdjacentHTML("beforeend", menuRowHtml());
    });
    document.getElementById("pvMenuRows").addEventListener("click", function (e) {
      if (e.target.closest("[data-rm-row]")) e.target.closest(".menu-row").remove();
    });

    document.getElementById("pvSaveBtn").addEventListener("click", async function () {
      var btn = this;
      var msg = document.getElementById("pvMsg");
      btn.disabled = true;
      msg.className = "msg";
      msg.textContent = "Guardando...";
      try {
        var logoFile = document.getElementById("pvLogoFile").files[0];
        var heroFile = document.getElementById("pvHeroFile").files[0];
        var galleryFiles = document.getElementById("pvGalleryFile").files;
        if (logoFile) newLogoUrl = await uploadImage(logoFile);
        if (heroFile) newHeroUrl = await uploadImage(heroFile);
        if (galleryFiles && galleryFiles.length) {
          for (var i = 0; i < galleryFiles.length; i++) newGallery.push(await uploadImage(galleryFiles[i]));
        }
        var payload = {
          restaurant_name: document.getElementById("pvName").value.trim(),
          tagline: document.getElementById("pvTagline").value.trim(),
          description: document.getElementById("pvDescription").value.trim(),
          logo_url: newLogoUrl,
          hero_image_url: newHeroUrl,
          gallery: newGallery,
          menu: readMenuRows(document.getElementById("pvMenuRows")),
          phone: document.getElementById("pvPhone").value.trim(),
          email: document.getElementById("pvEmail").value.trim(),
          address: document.getElementById("pvAddress").value.trim(),
          hours: document.getElementById("pvHours").value.trim(),
          instagram: document.getElementById("pvInstagram").value.trim(),
          facebook: document.getElementById("pvFacebook").value.trim(),
          tiktok: document.getElementById("pvTiktok").value.trim(),
          published: document.getElementById("pvPublished").checked,
        };
        var res = await sb.rpc("save_site_by_portal_token", { p_token: token, p_site: payload });
        if (res.error) throw res.error;
        msg.textContent = "Guardado.";
        renderSite(res.data);
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = "No se pudo guardar: " + (err.message || err);
      } finally {
        btn.disabled = false;
      }
    });
  }

  // ---- Operator: cobros con Stripe, plataformas de delivery, pedidos ----
  var DELIVERY_PLATFORMS = [
    { name: "Uber Eats", color: "#06C167", url: "https://merchants.ubereats.com/us/en/get-started/", note: "Recibe pedidos en la app oficial Uber Eats Orders, en el mismo iPad o teléfono." },
    { name: "DoorDash", color: "#EB1700", url: "https://get.doordash.com/en-us/merchant-signup", note: "Da de alta tu trailer y recibe pedidos en la app oficial de DoorDash." },
    { name: "Grubhub", color: "#F63440", url: "https://get.grubhub.com/", note: "Conecta tu trailer con Grubhub for Restaurants." },
  ];

  function initOperator(site) {
    var subdomain = site && site.subdomain;
    var root = document.getElementById("operateRoot");
    if (!subdomain) {
      root.innerHTML = '<div class="full-error">Primero guarda tu sitio en Web Builder para activar Operator.</div>';
      return;
    }

    var paymentsEnabled = false;
    var currentOrders = [];
    var NEXT_STATUS = { nuevo: "preparando", preparando: "listo", listo: "completado" };
    var NEXT_LABEL = { nuevo: "Empezar a preparar →", preparando: "Marcar listo →", listo: "Marcar entregado →" };
    var STATUS_LABEL = { nuevo: "Nuevo", preparando: "Preparando", listo: "Listo", completado: "Completado", cancelado: "Cancelado" };

    function paymentsCardHtml() {
      return (
        '<div class="card">' +
          "<h2>Cobros</h2>" +
          '<div class="op-card-row">' +
            '<div class="op-badge" style="background:#635BFF;">STRIPE</div>' +
            '<div class="op-row-body"><h3>Cobra con tarjeta</h3><p>El dinero llega directo a tu cuenta — Tryla no lo retiene.</p></div>' +
            (paymentsEnabled
              ? '<span class="op-connected">✓ Conectado</span>'
              : '<button type="button" class="op-connect-btn primary" id="opConnectStripe">Conectar</button>') +
          "</div>" +
        "</div>"
      );
    }

    function platformsCardHtml() {
      return (
        '<div class="card">' +
          "<h2>Plataformas de delivery</h2>" +
          '<div class="hint" style="margin-bottom:2px;">Da de alta tu trailer en cada una y usa su app oficial de pedidos junto con TrylApp, en el mismo iPad o teléfono.</div>' +
          DELIVERY_PLATFORMS.map(function (p) {
            return (
              '<div class="op-card-row">' +
                '<div class="op-badge" style="background:' + p.color + ';">' + esc(p.name.replace(" ", "\n")) + "</div>" +
                '<div class="op-row-body"><h3>' + esc(p.name) + "</h3><p>" + esc(p.note) + "</p></div>" +
                '<a class="op-connect-btn ghost" href="' + p.url + '" target="_blank" rel="noopener">Conectar</a>' +
              "</div>"
            );
          }).join("") +
        "</div>"
      );
    }

    function ordersInnerHtml() {
      if (!currentOrders.length) {
        return '<div class="hint" style="margin:0;">Sin pedidos por ahora. En cuanto entre uno, aparece aquí al instante.</div>';
      }
      return '<div class="op-orders">' + currentOrders.map(function (o) {
        var items = (o.items || []).map(function (it) { return it.qty + "x " + esc(it.name); }).join(", ");
        var time = new Date(o.created_at).toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
        var next = NEXT_STATUS[o.status];
        return (
          '<div class="op-order status-' + o.status + '" data-order-id="' + o.id + '">' +
            '<div class="op-order-head">' +
              '<div><div class="op-order-name">' + esc(o.customer_name) + '</div><div class="op-order-time">' + esc(o.customer_phone) + " · " + time + "</div></div>" +
              '<span class="op-status-label">' + STATUS_LABEL[o.status] + "</span>" +
            "</div>" +
            '<div class="op-fulfill-pill">' + (o.fulfillment === "delivery" ? "🛵 Entrega — " + esc(o.delivery_address || "") : "🛍️ Recoger") + "</div>" +
            '<div class="op-order-items">' + items + (o.notes ? "<br><em>Nota: " + esc(o.notes) + "</em>" : "") + "</div>" +
            '<div class="op-order-total">$' + Number(o.total).toFixed(2) + "</div>" +
            (next
              ? '<div class="op-order-actions"><button type="button" class="op-btn-next" data-next="' + next + '">' + NEXT_LABEL[o.status] + '</button><button type="button" class="op-btn-cancel" data-cancel>Cancelar</button></div>'
              : "") +
          "</div>"
        );
      }).join("") + "</div>";
    }

    function fullRender() {
      root.innerHTML =
        paymentsCardHtml() +
        platformsCardHtml() +
        '<div class="card"><h2>Pedidos</h2>' + ordersInnerHtml() + "</div>";

      var stripeBtn = document.getElementById("opConnectStripe");
      if (stripeBtn) stripeBtn.addEventListener("click", connectStripe);

      root.querySelectorAll(".op-order").forEach(function (card) {
        var id = card.dataset.orderId;
        var nextBtn = card.querySelector("[data-next]");
        var cancelBtn = card.querySelector("[data-cancel]");
        if (nextBtn) nextBtn.addEventListener("click", function () { advanceOrder(id, nextBtn.dataset.next); });
        if (cancelBtn) cancelBtn.addEventListener("click", function () { advanceOrder(id, "cancelado"); });
      });
    }

    async function connectStripe() {
      var btn = document.getElementById("opConnectStripe");
      btn.disabled = true;
      btn.textContent = "Conectando...";
      try {
        var res = await sb.functions.invoke("stripe-connect-onboarding", {
          body: { portal_token: token, return_url: location.href, refresh_url: location.href },
        });
        if (res.error) throw res.error;
        if (res.data && res.data.error) throw new Error(res.data.error);
        location.href = res.data.url;
      } catch (e) {
        btn.disabled = false;
        btn.textContent = "Conectar";
        alert("No se pudo iniciar la conexión con Stripe: " + (e.message || e));
      }
    }

    async function advanceOrder(orderId, status) {
      try {
        var res = await sb.rpc("update_order_status_by_portal_token", { p_token: token, p_order_id: orderId, p_status: status });
        if (res.error) throw res.error;
        await loadOrders();
        fullRender();
      } catch (e) {
        alert("No se pudo actualizar el pedido: " + (e.message || e));
      }
    }

    async function loadOrders() {
      var res = await sb.rpc("get_orders_by_portal_token", { p_token: token });
      currentOrders = res.error ? [] : (res.data || []);
    }
    async function loadPaymentStatus() {
      var res = await sb.rpc("get_payment_status", { p_subdomain: subdomain });
      paymentsEnabled = !!res.data;
    }

    Promise.all([loadPaymentStatus(), loadOrders()]).then(fullRender);

    try {
      sb.channel("orders-" + subdomain)
        .on("postgres_changes", { event: "*", schema: "public", table: "orders", filter: "subdomain=eq." + subdomain }, function () {
          loadOrders().then(fullRender);
        })
        .subscribe();
    } catch (e) {
      console.warn("[Operator] Realtime no disponible:", e);
    }
  }

  sb.rpc("get_site_by_portal_token", { p_token: token })
    .then(function (res) {
      if (res.error) throw res.error;
      renderSite(res.data);
      initOperator(res.data);
    })
    .catch(function () {
      document.getElementById("siteRoot").innerHTML = '<div class="full-error">Este link de portal ya no es valido. Contacta a tu asesor de Tryla.</div>';
    });
})();
</script>
</body>
</html>
