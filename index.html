<style>
  @font-face{font-family:'Unbounded';src:url('fonts/unbounded-800.woff2') format('woff2');font-weight:800;font-display:swap;}
  @font-face{font-family:'Sora';src:url('fonts/sora-700.woff2') format('woff2');font-weight:700;font-display:swap;}
  @font-face{font-family:'Barlow';src:url('fonts/barlow-400.woff2') format('woff2');font-weight:400;font-display:swap;}
  @font-face{font-family:'Barlow';src:url('fonts/barlow-600.woff2') format('woff2');font-weight:600;font-display:swap;}
  @font-face{font-family:'Barlow';src:url('fonts/barlow-700.woff2') format('woff2');font-weight:700;font-display:swap;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    font-family:'Barlow',Arial,sans-serif; background:#06070A; min-height:100vh; color:#171433;
    overscroll-behavior-y:none;
  }

  /* ================= App shell (iOS-style) ================= */
  #app{ display:flex; flex-direction:column; height:100dvh; }

  .ios-nav{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px;
    background:linear-gradient(165deg,#06070A 0%,#06038D 160%);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .ios-nav .brand{ display:flex; align-items:center; gap:9px; }
  .ios-nav .mark{ width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#5B54FF,#3B36D6);display:flex;align-items:center;justify-content:center;flex-shrink:0; }
  .ios-nav .word{ font-family:'Unbounded',Arial,sans-serif; font-weight:800; font-size:15px; color:#fff; letter-spacing:-0.2px; }
  .ios-nav .client-name{ font-size:11px; color:#C9C6FF; font-weight:600; }
  .ios-nav a.site-link{ font:700 12px/1 'Sora',Arial,sans-serif; color:#fff; text-decoration:none; border:1.5px solid rgba(255,255,255,.3); padding:8px 12px; border-radius:20px; }

  .ios-screens{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; background:#F2F1F8; }
  #app.landing-mode .ios-screens{ background:transparent; }
  .ios-screen{ display:none; padding:18px 16px calc(28px + env(safe-area-inset-bottom,0px)); max-width:640px; margin:0 auto; }
  .ios-screen.active{ display:block; animation:screenIn .28s cubic-bezier(.22,.61,.36,1); }
  @keyframes screenIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  @media(prefers-reduced-motion:reduce){ .ios-screen.active{ animation:none; } }

  .ios-tabbar{
    flex:0 0 auto; display:flex; background:rgba(255,255,255,.86); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-top:1px solid rgba(0,0,0,.08); padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
  }
  .ios-tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px;
    background:none; border:none; color:#8B87A6; font:600 10px/1.1 'Sora',Arial,sans-serif; cursor:pointer;
  }
  .ios-tab svg{ width:23px; height:23px; stroke:#8B87A6; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transition:stroke .15s ease, transform .15s ease; }
  .ios-tab.active{ color:#5B54FF; }
  .ios-tab.active svg{ stroke:#5B54FF; transform:translateY(-1px) scale(1.06); }
  .ios-tab .dot{ position:absolute; margin-top:-24px; margin-left:14px; width:7px; height:7px; border-radius:50%; background:#E0A94C; border:1.5px solid #fff; }

  /* ================= Desktop shell (sidebar nav) ================= */
  @media (min-width:880px){
    #app:not(.landing-mode){ display:grid; grid-template-columns:240px 1fr; grid-template-rows:auto 1fr; grid-template-areas:"nav nav" "tabbar screens"; height:100vh; }
    #app:not(.landing-mode) .ios-nav{ grid-area:nav; padding:16px 28px; }
    #app:not(.landing-mode) .ios-nav .word{ font-size:17px; }
    #app:not(.landing-mode) .ios-screens{ grid-area:screens; padding:8px 0 40px; }
    #app:not(.landing-mode) .ios-screen{ max-width:760px; padding:32px 40px calc(40px + env(safe-area-inset-bottom,0px)); margin:0; }
    #app:not(.landing-mode) .section-title{ font-size:23px; }

    .ios-tabbar{
      grid-area:tabbar; flex-direction:column; align-items:stretch; gap:3px; width:240px;
      background:#fff; border-top:none; border-right:1px solid #EAE9F5; backdrop-filter:none; -webkit-backdrop-filter:none;
      padding:18px 12px calc(18px + env(safe-area-inset-bottom,0px)); overflow-y:auto;
    }
    .ios-tab{
      flex-direction:row; justify-content:flex-start; align-items:center; gap:12px; text-align:left;
      padding:11px 14px; border-radius:11px; font-size:13.5px;
    }
    .ios-tab:hover{ background:#F5F4FC; }
    .ios-tab.active{ background:#F1F0FF; }
    .ios-tab svg{ width:20px; height:20px; flex-shrink:0; }
    .ios-tab .dot{ position:static; margin:0 0 0 auto; }

    .op-orders{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); align-items:start; gap:14px; }
    .row .field{ min-width:220px; }
  }

  /* ---- generic iOS-ish card language ---- */
  .card{ background:#fff; border-radius:16px; padding:20px 20px; margin-bottom:14px; box-shadow:0 1px 2px rgba(20,16,50,.05); }
  .card h2{ font-family:'Sora',Arial,sans-serif; font-weight:700; font-size:15px; color:#06038D; margin:0 0 4px; }
  .card .hint{ font-size:12px; color:#7c8aa6; margin-bottom:14px; line-height:1.5; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11px; font-weight:700; letter-spacing:.5px; color:#5b6b8c; text-transform:uppercase; margin-bottom:5px; }
  .field input[type=text], .field input[type=email], .field select, .field textarea{
    width:100%; border:1.5px solid #E4E2F5; border-radius:10px; padding:12px 13px; font:14px/1.4 'Barlow',Arial,sans-serif; color:#171433; background:#F8F7FF; -webkit-appearance:none; appearance:none;
  }
  .field input[type=file]{ font-size:12.5px; }
  .row{ display:flex; gap:12px; flex-wrap:wrap; }
  .row .field{ flex:1; min-width:150px; }
  .btn{ font:700 14px/1 'Sora',Arial,sans-serif; padding:14px 20px; border-radius:12px; cursor:pointer; border:none; background:#5B54FF; color:#fff; width:100%; }
  .btn:active{ transform:scale(.98); }
  .btn.outline{ background:#F1F0FF; color:#5B54FF; }
  .msg{ font-size:12.5px; color:#1CAD5A; font-weight:700; margin-top:10px; display:block; }
  .msg.err{ color:#C0392B; }

  .section-title{ font-family:'Sora',Arial,sans-serif; font-weight:700; font-size:19px; color:#171433; margin:2px 0 16px; }

  /* ---- landing (no token) ---- */
  .landing{ max-width:980px; margin:0 auto; padding:64px 20px 90px; }
  .landing-hero{ max-width:560px; margin:0 auto; text-align:center; }
  .landing h1{ font-family:'Sora',Arial,sans-serif; font-weight:700; font-size:clamp(26px,5vw,34px); color:#fff; line-height:1.15; margin:0 0 16px; }
  .landing p{ font-size:15px; color:#C9C6FF; line-height:1.6; margin:0 0 30px; }
  .landing .actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .landing .btn2{ font:700 14px/1 Arial,sans-serif; padding:13px 22px; border-radius:9px; text-decoration:none; display:inline-flex; align-items:center; gap:8px; }
  .landing .btn2.primary{ background:#25D366; color:#06070A; }
  .landing .btn2.outline{ background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.35); }
  .landing .fine{ margin-top:48px; font-size:12px; color:#7c76a8; text-align:center; }
  .full-loading, .full-error{ color:#C9C6FF; text-align:center; padding:100px 20px; font-size:14px; }

  .landing-features{ margin-top:64px; }
  .landing-tag{
    display:inline-flex; align-items:center; gap:8px; background:linear-gradient(135deg,#5B54FF,#3B36D6); color:#fff;
    font:700 10.5px/1 'Sora',Arial,sans-serif; letter-spacing:2px; text-transform:uppercase; padding:7px 14px; border-radius:4px;
    box-shadow:0 6px 18px rgba(91,84,255,.25);
  }
  .feat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:20px; }
  @media(max-width:860px){ .feat-grid{ grid-template-columns:1fr 1fr; } }
  @media(max-width:560px){ .feat-grid{ grid-template-columns:1fr; } }
  .feat-card{
    background:#101218; border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:22px 20px;
    transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .feat-card:hover{ border-color:rgba(91,84,255,.5); transform:translateY(-3px); box-shadow:0 10px 30px rgba(91,84,255,.22); }
  .feat-icon{
    width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg,#5B54FF,#3B36D6);
    display:flex; align-items:center; justify-content:center; margin-bottom:14px; box-shadow:0 6px 18px rgba(91,84,255,.3);
  }
  .feat-icon svg{ width:19px; height:19px; stroke:#fff; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .feat-card h3{ font-family:'Sora',Arial,sans-serif; font-weight:700; font-size:14.5px; color:#fff; margin:0 0 6px; }
  .feat-card p{ font-size:12.5px; color:#9AA0AF; line-height:1.55; margin:0; }
  .feat-card .feat-soon{ display:inline-block; margin-top:10px; font:700 9.5px/1 'Sora',Arial,sans-serif; letter-spacing:1px; text-transform:uppercase; color:#C9C6FF; background:rgba(201,198,255,.12); padding:5px 10px; border-radius:999px; }

  /* ---- login / registro ---- */
  .auth-wrap{ max-width:380px; margin:0 auto; padding:64px 20px 60px; }
  .auth-card{ background:#101218; border:1px solid rgba(255,255,255,.08); border-radius:18px; padding:30px 26px; }
  .auth-card h1{ font-family:'Sora',Arial,sans-serif; font-weight:700; font-size:21px; color:#fff; margin:0 0 6px; text-align:center; }
  .auth-card .auth-sub{ font-size:13px; color:#9AA0AF; text-align:center; margin:0 0 24px; line-height:1.5; }
  .auth-field{ margin-bottom:12px; }
  .auth-field label{ display:block; font-size:11px; font-weight:700; letter-spacing:.5px; color:#9AA0AF; text-transform:uppercase; margin-bottom:6px; }
  .auth-field input{
    width:100%; border:1.5px solid rgba(255,255,255,.12); border-radius:10px; padding:12px 13px;
    font:14px/1.4 'Barlow',Arial,sans-serif; color:#fff; background:#1c1f2a;
  }
  .auth-submit{ font:700 14px/1 'Sora',Arial,sans-serif; padding:14px; border-radius:11px; cursor:pointer; border:none; background:#5B54FF; color:#fff; width:100%; margin-top:6px; }
  .auth-submit:disabled{ opacity:.6; }
  .auth-err{ color:#FF8A8A; font-size:12.5px; margin-top:12px; text-align:center; min-height:16px; }
  .auth-toggle{ text-align:center; margin-top:18px; font-size:12.5px; color:#9AA0AF; }
  .auth-toggle button{ background:none; border:none; color:#C9C6FF; font:700 12.5px 'Sora',Arial,sans-serif; cursor:pointer; padding:0; }
  .auth-divider{ display:flex; align-items:center; gap:12px; margin:22px 0 16px; color:#7c76a8; font-size:11.5px; }
  .auth-divider::before, .auth-divider::after{ content:""; flex:1; height:1px; background:rgba(255,255,255,.1); }
  .auth-oauth{ display:flex; flex-direction:column; gap:9px; }
  .auth-oauth-btn{
    display:flex; align-items:center; justify-content:center; gap:9px; width:100%; padding:12px;
    border-radius:10px; font:700 13.5px 'Sora',Arial,sans-serif; cursor:pointer; border:1.5px solid transparent;
  }
  .auth-oauth-btn.google{ background:#fff; color:#1F1F1F; border-color:rgba(0,0,0,.1); }
  .auth-oauth-btn.facebook{ background:#1877F2; color:#fff; }
  .auth-oauth-btn.apple{ background:#000; color:#fff; }
  .auth-fine{ text-align:center; margin-top:28px; font-size:11.5px; color:#7c76a8; line-height:1.6; }

  /* ---- Web Builder (Mi Sitio) specifics ---- */
  .thumb{ display:inline-flex; align-items:center; gap:8px; margin-top:8px; font-size:11.5px; color:#5b6b8c; }
  .thumb img{ width:44px; height:44px; object-fit:cover; border-radius:6px; border:1px solid #E4E2F5; }
  .gallery-preview{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .gallery-preview img{ width:56px; height:56px; object-fit:cover; border-radius:6px; border:1px solid #E4E2F5; }
  .menu-row{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .menu-row input{ flex:1; }
  .menu-row input.menu-price{ flex:0 0 84px; }
  .menu-row button{ flex:0 0 auto; background:none; border:none; color:#C0392B; font-size:18px; cursor:pointer; line-height:1; padding:4px 8px; }
  .add-row{ font:700 12.5px 'Sora',Arial,sans-serif; color:#5B54FF; background:none; border:1.5px dashed #C9C6FF; border-radius:10px; padding:9px 14px; cursor:pointer; width:100%; }
  .publish{ display:flex; align-items:center; gap:10px; background:#F1F0FF; border-radius:10px; padding:12px 14px; margin-bottom:14px; }
  .publish label{ font-size:13px; font-weight:700; color:#06038D; }
  .live-link{ font-size:12.5px; color:#5B54FF; }
  @media(max-width:400px){
    .menu-row{ flex-wrap:wrap; }
    .menu-row input, .menu-row input.menu-price{ flex:1 1 100%; }
    .menu-row button{ margin-left:auto; }
  }

  /* ---- Location Intelligence specifics ---- */
  .li-score-card{ text-align:center; background:linear-gradient(135deg,#5B54FF,#3B36D6); border-radius:12px; padding:18px; margin-bottom:14px; color:#fff; }
  .li-score-label{ font:700 10px/1 'Sora',Arial,sans-serif; letter-spacing:1.5px; text-transform:uppercase; opacity:.85; }
  .li-score-num{ font-family:'Sora',Arial,sans-serif; font-weight:700; font-size:34px; margin:6px 0 2px; }
  .li-score-sub{ font-size:12.5px; opacity:.9; }
  .li-metric{ margin-bottom:12px; }
  .li-metric:last-child{ margin-bottom:0; }
  .li-metric-head{ display:flex; justify-content:space-between; font-size:12.5px; color:#5b6b8c; margin-bottom:5px; }
  .li-metric-head b{ color:#171433; }
  .li-bar{ height:6px; border-radius:4px; background:#EEEDF9; overflow:hidden; }
  .li-bar span{ display:block; height:100%; background:linear-gradient(90deg,#5B54FF,#8B86FF); border-radius:4px; transition:width .5s ease; }
  .li-insight{ font-size:13px; color:#3d3a5c; padding:8px 0; border-top:1px solid #EEEDF9; line-height:1.5; }
  .li-insight:first-child{ border-top:none; }

  /* ---- stub / coming soon screens ---- */
  .stub{ text-align:center; padding:36px 10px; }
  .stub .stub-icon{ width:64px; height:64px; border-radius:18px; background:linear-gradient(135deg,#5B54FF,#3B36D6); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
  .stub .stub-icon svg{ width:30px; height:30px; stroke:#fff; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .stub h2{ font-family:'Sora',Arial,sans-serif; font-weight:700; font-size:18px; color:#171433; margin:0 0 10px; }
  .stub p{ font-size:13.5px; color:#5b6b8c; line-height:1.6; max-width:340px; margin:0 auto; }
  .stub .soon-pill{ display:inline-block; margin-top:16px; font:700 10.5px/1 'Sora',Arial,sans-serif; letter-spacing:1px; text-transform:uppercase; color:#5B54FF; background:#F1F0FF; padding:7px 14px; border-radius:999px; }

  /* ---- Operator: cobros, plataformas de delivery, pedidos ---- */
  .op-card-row{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #F0EFFA; }
  .op-card-row:last-child{ border-bottom:none; }
  .op-badge{ width:46px; height:46px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff; font:800 8.5px/1.15 'Sora',Arial,sans-serif; text-align:center; letter-spacing:-.1px; white-space:pre-line; }
  .op-row-body{ flex:1; min-width:0; }
  .op-row-body h3{ font:700 14px/1.3 'Sora',Arial,sans-serif; color:#171433; margin:0 0 2px; }
  .op-row-body p{ font-size:11.5px; color:#7c8aa6; margin:0; line-height:1.4; }
  .op-connect-btn{ font:700 12.5px/1 'Sora',Arial,sans-serif; padding:10px 14px; border-radius:9px; white-space:nowrap; text-decoration:none; flex-shrink:0; border:none; cursor:pointer; }
  .op-connect-btn.primary{ background:#5B54FF; color:#fff; }
  .op-connect-btn.ghost{ background:#F1F0FF; color:#5B54FF; }
  .op-connected{ display:flex; align-items:center; gap:6px; font:700 12.5px 'Sora',Arial,sans-serif; color:#1CAD5A; flex-shrink:0; }

  .op-orders{ display:flex; flex-direction:column; gap:12px; }
  .op-order{ background:#fff; border-radius:14px; padding:16px; box-shadow:0 1px 2px rgba(20,16,50,.05); border-left:4px solid #5B54FF; }
  .op-order.status-listo{ border-left-color:#1CAD5A; }
  .op-order.status-completado{ border-left-color:#C9C6D9; opacity:.65; }
  .op-order.status-cancelado{ border-left-color:#C0392B; opacity:.55; }
  .op-order-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; }
  .op-order-name{ font:700 14.5px 'Sora',Arial,sans-serif; color:#171433; }
  .op-order-time{ font-size:11px; color:#9aa3bf; margin-top:1px; }
  .op-status-label{ font:700 10.5px 'Sora',Arial,sans-serif; color:#8B87A6; text-transform:uppercase; letter-spacing:.5px; flex-shrink:0; }
  .op-fulfill-pill{ display:inline-block; font:700 10.5px/1 'Sora',Arial,sans-serif; padding:5px 10px; border-radius:999px; background:#F1F0FF; color:#5B54FF; margin-bottom:9px; }
  .op-order-items{ font-size:12.5px; color:#5b6b8c; line-height:1.6; margin-bottom:8px; }
  .op-order-total{ font:700 17px/1 'Sora',Arial,sans-serif; color:#171433; margin-bottom:12px; }
  .op-order-actions{ display:flex; gap:8px; }
  .op-btn-next{ flex:1; font:700 13px/1 'Sora',Arial,sans-serif; padding:13px; border-radius:10px; border:none; background:#5B54FF; color:#fff; cursor:pointer; }
  .op-btn-cancel{ flex:0 0 auto; font:700 13px/1 'Sora',Arial,sans-serif; padding:13px 16px; border-radius:10px; border:none; background:#FBEAEA; color:#C0392B; cursor:pointer; }
  .op-btn-next:active, .op-btn-cancel:active{ transform:scale(.98); }
</style>
</head>
<body>

<div id="app">
  <div class="ios-nav">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 120 120" width="29" height="29">
          <polygon points="21.6,25.8 98.3,25.8 106.9,45.0 30.2,45.0" fill="#fff"/>
          <polygon points="57.9,45.0 79.2,45.0 100.5,94.2 79.2,94.2" fill="#fff"/>
        </svg>
      </div>
      <div>
        <div class="word">TRYLA</div>
        <div class="client-name" id="navClientName"></div>
      </div>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <button type="button" class="site-link" id="navLangToggle" style="background:none; cursor:pointer;">EN</button>
      <a class="site-link" href="https://thetryla.com" target="_blank" rel="noopener" id="navSiteLink">Sitio</a>
      <button type="button" class="site-link" id="navSignOut" style="display:none; background:none; cursor:pointer;">Salir</button>
    </div>
  </div>

  <div class="ios-screens" id="screens"><div class="full-loading">Cargando...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="location-intel.js"></script>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var token = qs.get("portal");

  async function submitAuth(mode) {
    var btn = document.getElementById("authSubmitBtn");
    var err = document.getElementById("authErr");
    var email = document.getElementById("authEmail").value.trim();
    var password = document.getElementById("authPassword").value;
    err.textContent = "";
    if (!email || !password) { err.textContent = t("auth_err_missing"); return; }
    btn.disabled = true;
    btn.textContent = mode === "signup" ? t("auth_loading_signup") : t("auth_loading_signin");
    try {
      var res = mode === "signup"
        ? await sb.auth.signUp({ email: email, password: password })
        : await sb.auth.signInWithPassword({ email: email, password: password });
      if (res.error) throw res.error;
      if (mode === "signup" && res.data && res.data.user && !res.data.session) {
        document.querySelector(".auth-card").innerHTML =
          '<h1>' + t("auth_check_email_title") + '</h1><p class="auth-sub">' + t("auth_check_email_body1") + esc(email) + t("auth_check_email_body2") + '</p>';
        return;
      }
      boot();
    } catch (e) {
      btn.disabled = false;
      btn.textContent = mode === "signup" ? t("auth_btn_signup") : t("auth_btn_signin");
      err.textContent = e.message || t("auth_err_generic");
    }
  }

  function oauthSignIn(provider) {

  }

    currentRerender = renderOnboarding;
    document.getElementById("app").classList.add("landing-mode");
    document.getElementById("navSignOut").style.display = "";
    screensEl.innerHTML =
      '<div class="landing"><div class="auth-wrap"><div class="auth-card">' +
        '<h1>' + t("onboarding_title") + '</h1>' +
        '<p class="auth-sub">' + t("onboarding_sub") + '</p>' +
        '<div class="auth-field"><label>' + t("onboarding_name") + '</label><input type="text" id="obName"></div>' +
        '<div class="auth-field"><label>' + t("onboarding_subdomain") + '</label><input type="text" id="obSubdomain" placeholder="tacos-el-sol"></div>' +
        '<button type="button" class="auth-submit" id="obSubmitBtn">' + t("onboarding_create") + '</button>' +
        '<div class="auth-err" id="obErr"></div>' +
      '</div></div></div>';

    document.getElementById("obSubmitBtn").addEventListener("click", async function () {
      var btn = this;
      var err = document.getElementById("obErr");
      var name = document.getElementById("obName").value.trim();
      var subdomain = document.getElementById("obSubdomain").value.trim().toLowerCase().replace(/[^a-z0-9-]/g, "-");
      err.textContent = "";
      if (!name || !subdomain) { err.textContent = t("onboarding_missing"); return; }
      btn.disabled = true;
      btn.textContent = t("onboarding_creating");
      try {
        var site = await siteApi.createSite({
          subdomain: subdomain,
          restaurant_name: name,
          owner_user_id: currentUserId,
          published: false,
        });
        buildAppShell(site);
      } catch (e) {
        btn.disabled = false;
        btn.textContent = t("onboarding_create");
        err.textContent = /duplicate key|unique/i.test(e.message || "") ? t("onboarding_dup") : (e.message || t("auth_err_generic"));
      }
    });
  }

    });

  // ---- Location Intelligence wiring ----
  var TLI = window.TrylaLocationIntel;
  document.getElementById("liAnalyzeBtn").addEventListener("click", async function () {
    var address = document.getElementById("liAddress").value.trim();
    if (!address) { document.getElementById("liAddress").focus(); return; }
    var cuisine = document.getElementById("liCuisine").value;
    var r = TLI.scoreFor(address, cuisine);
    var tier = TLI.tier(r.overall10);
    document.getElementById("liScoreNum").textContent = r.overall10.toFixed(1) + " / 10";
    document.getElementById("liScoreSub").textContent = tier.label;
    document.getElementById("liMetricTraffic").textContent = r.traffic;
    document.getElementById("liMetricComp").textContent = r.space;
    document.getElementById("liMetricDemo").textContent = r.demo;
    document.getElementById("liMetricGap").textContent = r.gap;
    document.getElementById("liBarTraffic").style.width = r.traffic + "%";
    document.getElementById("liBarComp").style.width = r.space + "%";
    document.getElementById("liBarDemo").style.width = r.demo + "%";
    document.getElementById("liBarGap").style.width = r.gap + "%";
    var insightsEl = document.getElementById("liInsights");
    insightsEl.innerHTML = "";
    TLI.insightsFor(r, cuisine).forEach(function (text) {
      var div = document.createElement("div");
      div.className = "li-insight";
      div.textContent = text;
      insightsEl.appendChild(div);
    });
    document.getElementById("liResultCard").style.display = "block";
    var point = await TLI.geocode(address);
    if (point) {
      try {
        await TLI.mountMap(document.getElementById("liMap"), point, r);
      } catch (mmErr) {
        console.warn("No se pudo cargar el mapa:", mmErr);
      }
    }
  });

    renderSite(site);
    initOperator(site);
  }

  // ---- Web Builder (Mi Sitio) ----
  function menuRowHtml(item) {
    item = item || {};
    return (
      '<div class="menu-row">' +
      '<input type="text" class="menu-name" placeholder="' + t("site_dish_ph") + '" value="' + esc(item.name) + '">' +
      '<input type="text" class="menu-price" placeholder="' + t("site_price_ph") + '" value="' + esc(item.price) + '">' +
      '<input type="text" class="menu-desc" placeholder="' + t("site_desc_ph") + '" value="' + esc(item.desc) + '">' +
      '<button type="button" data-rm-row aria-label="' + t("site_remove") + '">&times;</button>' +
      "</div>"
    );
  }
  function readMenuRows(el) {
    var rows = [];
    el.querySelectorAll(".menu-row").forEach(function (row) {
      var name = row.querySelector(".menu-name").value.trim();
      var price = row.querySelector(".menu-price").value.trim();
      var desc = row.querySelector(".menu-desc").value.trim();
      if (name || price || desc) rows.push({ name: name, price: price, desc: desc });
    });
    return rows;
  }
  function uploadPath(file, site) {
    var ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
    var prefix = (site && site.subdomain ? site.subdomain : "sin-asignar").replace(/[^a-z0-9-]/gi, "-");
    return prefix + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
  }
  async function uploadImage(file, site) {
    var path = uploadPath(file, site);
    var res = await sb.storage.from("site-images").upload(path, file, { upsert: true, cacheControl: "3600", contentType: file.type || undefined });
    if (res.error) throw res.error;
    return sb.storage.from("site-images").getPublicUrl(path).data.publicUrl;
  }

  function renderSite(site) {
    site = site || {};
    var gallery = Array.isArray(site.gallery) ? site.gallery : [];
    var menu = Array.isArray(site.menu) ? site.menu : [];
    var siteRoot = document.getElementById("siteRoot");

    document.getElementById("navClientName").textContent = site.restaurant_name || "";

    siteRoot.innerHTML =
      '<div class="card">' +
        "<h2>" + t("site_welcome") + (site.restaurant_name ? ", " + esc(site.restaurant_name) : "") + "</h2>" +
        '<div class="hint">' + t("site_hint") +
        (site.subdomain ? t("site_your_site") + '<a class="live-link" href="https://' + esc(site.subdomain) + '.thetryla.com" target="_blank">' + esc(site.subdomain) + ".thetryla.com</a>" : "") +
        "</div>" +
        '<div class="field"><label>' + t("site_name") + '</label><input type="text" id="pvName" value="' + esc(site.restaurant_name) + '"></div>' +
        '<div class="field"><label>' + t("site_tagline") + '</label><input type="text" id="pvTagline" value="' + esc(site.tagline) + '"></div>' +
        '<div class="field"><label>' + t("site_description") + '</label><textarea id="pvDescription" rows="3">' + esc(site.description) + "</textarea></div>" +
      "</div>" +

      '<div class="card">' +
        "<h2>" + t("site_photos") + "</h2>" +
        '<div class="field"><label>' + t("site_logo") + '</label><input type="file" id="pvLogoFile" accept="image/*">' +
          (site.logo_url ? '<div class="thumb"><img src="' + esc(site.logo_url) + '">' + t("site_current") + '</div>' : "") +
        "</div>" +
        '<div class="field"><label>' + t("site_hero") + '</label><input type="file" id="pvHeroFile" accept="image/*">' +
          (site.hero_image_url ? '<div class="thumb"><img src="' + esc(site.hero_image_url) + '">' + t("site_current") + '</div>' : "") +
        "</div>" +
        '<div class="field"><label>' + t("site_gallery") + '</label><input type="file" id="pvGalleryFile" accept="image/*" multiple>' +
          (gallery.length ? '<div class="gallery-preview">' + gallery.map(function (u) { return '<img src="' + esc(u) + '">'; }).join("") + "</div>" : "") +
        "</div>" +
      "</div>" +

      '<div class="card">' +
        "<h2>" + t("site_menu") + "</h2>" +
        '<div id="pvMenuRows">' + (menu.length ? menu.map(menuRowHtml).join("") : menuRowHtml()) + "</div>" +
        '<button type="button" class="add-row" id="pvAddMenuRow">' + t("site_add_dish") + '</button>' +
      "</div>" +

      '<div class="card">' +
        "<h2>" + t("site_contact") + "</h2>" +
        '<div class="row">' +
          '<div class="field"><label>' + t("site_phone") + '</label><input type="text" id="pvPhone" value="' + esc(site.phone) + '"></div>' +
          '<div class="field"><label>' + t("site_email") + '</label><input type="email" id="pvEmail" value="' + esc(site.email) + '"></div>' +
        "</div>" +
        '<div class="row">' +
          '<div class="field"><label>' + t("site_address") + '</label><input type="text" id="pvAddress" value="' + esc(site.address) + '"></div>' +
          '<div class="field"><label>' + t("site_hours") + '</label><input type="text" id="pvHours" value="' + esc(site.hours) + '"></div>' +
        "</div>" +
        '<div class="row">' +
          '<div class="field"><label>' + t("site_instagram") + '</label><input type="text" id="pvInstagram" value="' + esc(site.instagram) + '"></div>' +
          '<div class="field"><label>' + t("site_facebook") + '</label><input type="text" id="pvFacebook" value="' + esc(site.facebook) + '"></div>' +
          '<div class="field"><label>' + t("site_tiktok") + '</label><input type="text" id="pvTiktok" value="' + esc(site.tiktok) + '"></div>' +
        "</div>" +
      "</div>" +

      '<div class="card">' +
        '<div class="publish"><input type="checkbox" id="pvPublished"' + (site.published ? " checked" : "") + "> <label for=\"pvPublished\">" + t("site_published") + "</label></div>" +
        '<button type="button" class="btn" id="pvSaveBtn">' + t("site_save") + '</button>' +
        '<span class="msg" id="pvMsg"></span>' +
      "</div>";

    var newLogoUrl = site.logo_url || null;
    var newHeroUrl = site.hero_image_url || null;
    var newGallery = gallery.slice();

    document.getElementById("pvAddMenuRow").addEventListener("click", function () {
      document.getElementById("pvMenuRows").insertAdjacentHTML("beforeend", menuRowHtml());
    });
    document.getElementById("pvMenuRows").addEventListener("click", function (e) {
      if (e.target.closest("[data-rm-row]")) e.target.closest(".menu-row").remove();
    });

    document.getElementById("pvSaveBtn").addEventListener("click", async function () {
      var btn = this;
      var msg = document.getElementById("pvMsg");
      btn.disabled = true;
      msg.className = "msg";
      msg.textContent = t("site_saving");
      try {
        var logoFile = document.getElementById("pvLogoFile").files[0];
        var heroFile = document.getElementById("pvHeroFile").files[0];
        var galleryFiles = document.getElementById("pvGalleryFile").files;
        if (logoFile) newLogoUrl = await uploadImage(logoFile, site);
        if (heroFile) newHeroUrl = await uploadImage(heroFile, site);
        if (galleryFiles && galleryFiles.length) {
          for (var i = 0; i < galleryFiles.length; i++) newGallery.push(await uploadImage(galleryFiles[i], site));
        }
        var payload = {
          restaurant_name: document.getElementById("pvName").value.trim(),
          tagline: document.getElementById("pvTagline").value.trim(),
          description: document.getElementById("pvDescription").value.trim(),
          logo_url: newLogoUrl,
          hero_image_url: newHeroUrl,
          gallery: newGallery,
          menu: readMenuRows(document.getElementById("pvMenuRows")),
          phone: document.getElementById("pvPhone").value.trim(),
          email: document.getElementById("pvEmail").value.trim(),
          address: document.getElementById("pvAddress").value.trim(),
          hours: document.getElementById("pvHours").value.trim(),
          instagram: document.getElementById("pvInstagram").value.trim(),
          facebook: document.getElementById("pvFacebook").value.trim(),
          tiktok: document.getElementById("pvTiktok").value.trim(),
          published: document.getElementById("pvPublished").checked,
        };
        var saved = await siteApi.saveSite(payload, site.id);
        msg.textContent = t("site_saved");
        renderSite(saved);
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = t("site_save_error") + (err.message || err);
      } finally {
        btn.disabled = false;
      }
    });
  }

  // ---- Operator: cobros con Stripe, plataformas de delivery, pedidos ----
  var DELIVERY_PLATFORMS = [
    { name: "Uber Eats", color: "#06C167", url: "https://merchants.ubereats.com/us/en/get-started/", noteKey: "op_ubereats_note" },
    { name: "DoorDash", color: "#EB1700", url: "https://get.doordash.com/en-us/merchant-signup", noteKey: "op_doordash_note" },
    { name: "Grubhub", color: "#F63440", url: "https://get.grubhub.com/", noteKey: "op_grubhub_note" },
  ];

  function initOperator(site) {
    var subdomain = site && site.subdomain;
    var root = document.getElementById("operateRoot");
    if (!subdomain) {
      root.innerHTML = '<div class="full-error">' + t("op_need_site") + "</div>";
      return;
    }

    var paymentsEnabled = false;
    var currentOrders = [];
    var NEXT_STATUS = { nuevo: "preparando", preparando: "listo", listo: "completado" };
    var NEXT_LABEL = { nuevo: t("op_next_nuevo"), preparando: t("op_next_preparando"), listo: t("op_next_listo") };
    var STATUS_LABEL = { nuevo: t("status_nuevo"), preparando: t("status_preparando"), listo: t("status_listo"), completado: t("status_completado"), cancelado: t("status_cancelado") };

    function paymentsCardHtml() {
      return (
        '<div class="card">' +
          "<h2>" + t("op_billing") + "</h2>" +
          '<div class="op-card-row">' +
            '<div class="op-badge" style="background:#635BFF;">STRIPE</div>' +
            '<div class="op-row-body"><h3>' + t("op_stripe_title") + "</h3><p>" + t("op_stripe_body") + "</p></div>" +
            (paymentsEnabled
              ? '<span class="op-connected">' + t("op_connected") + "</span>"
              : '<button type="button" class="op-connect-btn primary" id="opConnectStripe">' + t("op_connect") + "</button>") +
          "</div>" +
        "</div>"
      );
    }

    function platformsCardHtml() {
      return (
        '<div class="card">' +
          "<h2>" + t("op_platforms_title") + "</h2>" +
          '<div class="hint" style="margin-bottom:2px;">' + t("op_platforms_hint") + "</div>" +
          DELIVERY_PLATFORMS.map(function (p) {
            return (
              '<div class="op-card-row">' +
                '<div class="op-badge" style="background:' + p.color + ';">' + esc(p.name.replace(" ", "\n")) + "</div>" +
                '<div class="op-row-body"><h3>' + esc(p.name) + "</h3><p>" + esc(t(p.noteKey)) + "</p></div>" +
                '<a class="op-connect-btn ghost" href="' + p.url + '" target="_blank" rel="noopener">' + t("op_connect") + "</a>" +
              "</div>"
            );
          }).join("") +
        "</div>"
      );
    }

    function ordersInnerHtml() {
      if (!currentOrders.length) {
        return '<div class="hint" style="margin:0;">' + t("op_orders_empty") + "</div>";
      }
      return '<div class="op-orders">' + currentOrders.map(function (o) {
        var items = (o.items || []).map(function (it) { return it.qty + "x " + esc(it.name); }).join(", ");
        var time = new Date(o.created_at).toLocaleTimeString(lang === "en" ? "en-US" : "es-MX", { hour: "2-digit", minute: "2-digit" });
        var next = NEXT_STATUS[o.status];
        return (
          '<div class="op-order status-' + o.status + '" data-order-id="' + o.id + '">' +
            '<div class="op-order-head">' +
              '<div><div class="op-order-name">' + esc(o.customer_name) + '</div><div class="op-order-time">' + esc(o.customer_phone) + " · " + time + "</div></div>" +
              '<span class="op-status-label">' + STATUS_LABEL[o.status] + "</span>" +
            "</div>" +
            '<div class="op-fulfill-pill">' + (o.fulfillment === "delivery" ? t("op_delivery") + esc(o.delivery_address || "") : t("op_pickup")) + "</div>" +
            '<div class="op-order-items">' + items + (o.notes ? "<br><em>" + t("op_note") + esc(o.notes) + "</em>" : "") + "</div>" +
            '<div class="op-order-total">$' + Number(o.total).toFixed(2) + "</div>" +
            (next
              ? '<div class="op-order-actions"><button type="button" class="op-btn-next" data-next="' + next + '">' + NEXT_LABEL[o.status] + '</button><button type="button" class="op-btn-cancel" data-cancel>' + t("op_cancel") + "</button></div>"
              : "") +
          "</div>"
        );
      }).join("") + "</div>";
    }

    function fullRender() {
      root.innerHTML =
        paymentsCardHtml() +
        platformsCardHtml() +
        '<div class="card"><h2>' + t("op_orders_title") + "</h2>" + ordersInnerHtml() + "</div>";

      var stripeBtn = document.getElementById("opConnectStripe");
      if (stripeBtn) stripeBtn.addEventListener("click", connectStripe);

      root.querySelectorAll(".op-order").forEach(function (card) {
        var id = card.dataset.orderId;
        var nextBtn = card.querySelector("[data-next]");
        var cancelBtn = card.querySelector("[data-cancel]");
        if (nextBtn) nextBtn.addEventListener("click", function () { advanceOrder(id, nextBtn.dataset.next); });
        if (cancelBtn) cancelBtn.addEventListener("click", function () { advanceOrder(id, "cancelado"); });
      });
    }

    async function connectStripe() {
      var btn = document.getElementById("opConnectStripe");
      btn.disabled = true;
      btn.textContent = t("op_connecting");
      try {
        var res = await siteApi.connectStripe();
        if (res.error) throw res.error;
        if (res.data && res.data.error) throw new Error(res.data.error);
        location.href = res.data.url;
      } catch (e) {
        btn.disabled = false;
        btn.textContent = t("op_connect");
        alert(t("op_stripe_error") + (e.message || e));
      }
    }

    async function advanceOrder(orderId, status) {
      try {
        await siteApi.updateOrderStatus(orderId, status);
        await loadOrders();
        fullRender();
      } catch (e) {
        alert(t("op_order_error") + (e.message || e));
      }
    }

    async function loadOrders() {
      currentOrders = await siteApi.getOrders(subdomain);
    }
    async function loadPaymentStatus() {
      paymentsEnabled = await siteApi.getPaymentStatus(subdomain);
    }

    Promise.all([loadPaymentStatus(), loadOrders()]).then(fullRender);

    try {
      if (ordersChannel) {
        sb.removeChannel(ordersChannel);
        ordersChannel = null;
      }
      ordersChannel = sb.channel("orders-" + subdomain)
        .on("postgres_changes", { event: "*", schema: "public", table: "orders", filter: "subdomain=eq." + subdomain }, function () {
          loadOrders().then(fullRender);
        })
        .subscribe();
    } catch (e) {
      console.warn("[Operator] Realtime no disponible:", e);
    }
  }

  // ---- Adaptadores: de donde sale "cual es mi sitio" ----
  function unwrapRpc(res) {
    if (res.error) throw res.error;
    return res.data;
  }

  function makeTokenSiteAPI(tok) {
    return {
      getSite: function () { return sb.rpc("get_site_by_portal_token", { p_token: tok }).then(unwrapRpc); },
      createSite: function () { throw new Error("no disponible con link de portal"); },
      saveSite: function (payload) { return sb.rpc("save_site_by_portal_token", { p_token: tok, p_site: payload }).then(unwrapRpc); },
      getOrders: function () { return sb.rpc("get_orders_by_portal_token", { p_token: tok }).then(function (r) { return r.error ? [] : (r.data || []); }); },
      updateOrderStatus: function (id, status) { return sb.rpc("update_order_status_by_portal_token", { p_token: tok, p_order_id: id, p_status: status }).then(unwrapRpc); },
      getPaymentStatus: function (subdomain) { return sb.rpc("get_payment_status", { p_subdomain: subdomain }).then(function (r) { return !!r.data; }); },
      connectStripe: function () { return sb.functions.invoke("stripe-connect-onboarding", { body: { portal_token: tok, return_url: location.href, refresh_url: location.href } }); },
      signOut: null,
    };
  }

  function makeAuthSiteAPI() {
    return {
      getSite: function () { return sb.from("tryla_sites").select("*").maybeSingle().then(unwrapRpc); },
      createSite: function (payload) { return sb.from("tryla_sites").insert(payload).select().single().then(unwrapRpc); },
      saveSite: function (payload, siteId) { return sb.from("tryla_sites").update(payload).eq("id", siteId).select().single().then(unwrapRpc); },
      getOrders: function (subdomain) { return sb.from("orders").select("*").eq("subdomain", subdomain).order("created_at", { ascending: false }).then(function (r) { return r.error ? [] : (r.data || []); }); },
      updateOrderStatus: function (id, status) { return sb.from("orders").update({ status: status, updated_at: new Date().toISOString() }).eq("id", id).select().single().then(unwrapRpc); },
      getPaymentStatus: function (subdomain) { return sb.from("client_payments").select("charges_enabled").eq("subdomain", subdomain).maybeSingle().then(function (r) { return !!(r.data && r.data.charges_enabled); }); },
      connectStripe: function () { return sb.functions.invoke("stripe-connect-onboarding", { body: { return_url: location.href, refresh_url: location.href } }); },
      signOut: function () { return sb.auth.signOut(); },
    };
  }

  // ---- Arranque: link de portal heredado, o sesion ----
  function boot() {
    if (token) {
      siteApi = makeTokenSiteAPI(token);
      siteApi.getSite()
        .then(function (site) { buildAppShell(site); })
        .catch(function () {
          renderAuthScreen("signin", t("auth_err_invalid_link"));
        });
      return;
    }

    sb.auth.getSession().then(function (res) {
      var session = res.data && res.data.session;
      if (!session) { renderAuthScreen("signin"); return; }
      currentUserId = session.user.id;
      siteApi = makeAuthSiteAPI();
      sb.rpc("claim_my_site").catch(function () {}).then(function () {
        return siteApi.getSite();
      }).then(function (site) {
        if (!site) { renderOnboarding(); return; }
        buildAppShell(site);
      }).catch(function (e) {
        console.warn("[TrylApp] error cargando tu cuenta:", e);
        renderAuthScreen("signin", t("auth_err_session"));
      });
    });
  }

  sb.auth.onAuthStateChange(function (event) {
    if (event === "SIGNED_OUT") location.reload();
  });

  boot();
})();
</script>
</body>
</html>
