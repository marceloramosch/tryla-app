<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrylApp</title>
<meta name="description" content="TrylApp — tu portal como cliente Tryla: edita tu sitio, y proximamente location intelligence y guia de permisos.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://thetryla.app/">
<meta property="og:site_name" content="TrylApp">
<meta property="og:title" content="TrylApp">
<meta property="og:description" content="Tu portal como cliente Tryla.">
<meta property="og:image" content="https://thetryla.app/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<style>
  @font-face{font-family:'Unbounded';src:url('fonts/unbounded-800.woff2') format('woff2');font-weight:800;font-display:swap;}
  @font-face{font-family:'Sora';src:url('fonts/sora-700.woff2') format('woff2');font-weight:700;font-display:swap;}
  @font-face{font-family:'Barlow';src:url('fonts/barlow-400.woff2') format('woff2');font-weight:400;font-display:swap;}
  @font-face{font-family:'Barlow';src:url('fonts/barlow-600.woff2') format('woff2');font-weight:600;font-display:swap;}
  @font-face{font-family:'Barlow';src:url('fonts/barlow-700.woff2') format('woff2');font-weight:700;font-display:swap;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Barlow',Arial,sans-serif; background:linear-gradient(165deg,#06070A 0%,#06038D 140%); min-height:100vh; color:#171433;
  }
  .top{ display:flex; align-items:center; justify-content:space-between; max-width:720px; margin:0 auto; padding:28px 20px 0; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{ width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#5B54FF,#3B36D6);display:flex;align-items:center;justify-content:center;flex-shrink:0; }
  .brand .word{ font-family:'Unbounded',Arial,sans-serif; font-weight:800; font-size:16px; color:#fff; letter-spacing:-0.2px; }
  .top a.site-link{ font:700 13px/1 Arial,sans-serif; color:#fff; text-decoration:none; border:1.5px solid rgba(255,255,255,.35); padding:9px 16px; border-radius:8px; }

  /* ---- landing (no token) ---- */
  .landing{ max-width:560px; margin:0 auto; padding:70px 20px 90px; text-align:center; }
  .landing h1{ font-family:'Unbounded',Arial,sans-serif; font-weight:800; font-size:clamp(26px,5vw,36px); color:#fff; line-height:1.15; margin:0 0 16px; }
  .landing p{ font-size:15px; color:#C9C6FF; line-height:1.6; margin:0 0 30px; }
  .landing .actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .landing .btn{ font:700 14px/1 Arial,sans-serif; padding:13px 22px; border-radius:9px; text-decoration:none; display:inline-flex; align-items:center; gap:8px; }
  .landing .btn.primary{ background:#25D366; color:#06070A; }
  .landing .btn.outline{ background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.35); }
  .landing .fine{ margin-top:40px; font-size:12px; color:#7c76a8; }

  /* ---- portal (Web Builder self-service) ---- */
  .pv-wrap{ max-width:720px; margin:0 auto; padding:26px 16px 80px; }
  .pv-card{ background:#fff; border-radius:12px; padding:30px 34px; margin-bottom:18px; }
  .pv-card h2{ font-family:'Unbounded',Arial,sans-serif; font-weight:800; font-size:15px; color:#06038D; margin:0 0 4px; }
  .pv-card .pv-hint{ font-size:12px; color:#7c8aa6; margin-bottom:16px; }
  .pv-field{ margin-bottom:14px; }
  .pv-field label{ display:block; font-size:11px; font-weight:700; letter-spacing:.5px; color:#5b6b8c; text-transform:uppercase; margin-bottom:5px; }
  .pv-field input[type=text], .pv-field input[type=email], .pv-field textarea{
    width:100%; border:1.5px solid #D6D3FF; border-radius:8px; padding:10px 12px; font:13px/1.4 Arial,sans-serif; color:#171433; background:#F8F7FF;
  }
  .pv-field input[type=file]{ font-size:12.5px; }
  .pv-row{ display:flex; gap:14px; flex-wrap:wrap; }
  .pv-row .pv-field{ flex:1; min-width:180px; }
  .pv-thumb{ display:inline-flex; align-items:center; gap:8px; margin-top:8px; font-size:11.5px; color:#5b6b8c; }
  .pv-thumb img{ width:44px; height:44px; object-fit:cover; border-radius:6px; border:1px solid #D6D3FF; }
  .pv-gallery-preview{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .pv-gallery-preview img{ width:56px; height:56px; object-fit:cover; border-radius:6px; border:1px solid #D6D3FF; }
  .pv-menu-row{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .pv-menu-row input{ flex:1; }
  .pv-menu-row input.pv-menu-price{ flex:0 0 90px; }
  .pv-menu-row button{ flex:0 0 auto; background:none; border:none; color:#C0392B; font-size:18px; cursor:pointer; line-height:1; padding:4px 8px; }
  .pv-add-row{ font:700 12.5px Arial,sans-serif; color:#5B54FF; background:none; border:1.5px dashed #C9C6FF; border-radius:8px; padding:8px 14px; cursor:pointer; }
  .pv-publish{ display:flex; align-items:center; gap:10px; background:#F1F0FF; border-radius:8px; padding:12px 14px; margin-top:6px; }
  .pv-publish label{ font-size:13px; font-weight:700; color:#06038D; }
  .pv-save-row{ display:flex; align-items:center; gap:14px; margin-top:8px; flex-wrap:wrap; }
  .pv-btn{ font:700 13px Arial,sans-serif; padding:11px 20px; border-radius:8px; cursor:pointer; border:none; background:#5B54FF; color:#fff; }
  .pv-msg{ font-size:12.5px; color:#1CAD5A; font-weight:700; }
  .pv-msg.err{ color:#C0392B; }
  .pv-live-link{ font-size:12.5px; color:#5B54FF; }
  .pv-loading, .pv-error{ color:#C9C6FF; text-align:center; padding:80px 20px; font-size:14px; }
  @media(max-width:560px){
    .pv-card{ padding:22px 18px; }
    .pv-menu-row{ flex-wrap:wrap; }
    .pv-menu-row input, .pv-menu-row input.pv-menu-price{ flex:1 1 100%; }
    .pv-menu-row button{ margin-left:auto; }
  }
</style>
</head>
<body>

<div class="top">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 120 120" width="20" height="20">
        <polygon points="21.6,25.8 98.3,25.8 106.9,45.0 30.2,45.0" fill="#fff"/>
        <polygon points="57.9,45.0 79.2,45.0 100.5,94.2 79.2,94.2" fill="#fff"/>
      </svg>
    </div>
    <span class="word">TrylApp</span>
  </div>
  <a class="site-link" href="https://thetryla.com" target="_blank" rel="noopener">thetryla.com</a>
</div>

<div id="pvRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var token = qs.get("portal");
  var root = document.getElementById("pvRoot");

  if (!token) {
    root.innerHTML =
      '<div class="landing">' +
        '<h1>Tu portal como cliente Tryla</h1>' +
        '<p>Aqui edita tu propio sitio (fotos, menu, contacto) y proximamente vas a poder ver recomendaciones de ubicacion y tu guia de permisos. Accede con el link privado que te compartio tu asesor de Tryla.</p>' +
        '<div class="actions">' +
          '<a class="btn primary" href="https://wa.me/16452353186?text=Hola%2C%20soy%20cliente%20de%20Tryla%20y%20necesito%20mi%20link%20de%20acceso%20a%20TrylApp" target="_blank">WhatsApp con tu asesor</a>' +
          '<a class="btn outline" href="tel:+16452353186">Llamar</a>' +
        '</div>' +
        '<div class="fine">&iquest;Ya te compartieron tu link? Abrelo directo, empieza con thetryla.app/?portal=</div>' +
      '</div>';
    return;
  }

  root.innerHTML = '<div class="pv-wrap"><div class="pv-loading">Cargando tu portal...</div></div>';
  var mount = root.firstChild;

  var SUPABASE_URL = "https://dcuescldzrgcppubcoxq.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_Ov7JqL4vOjjfkwDDD2DySg_I7huP9FH";

  if (typeof supabase === "undefined") {
    mount.innerHTML = '<div class="pv-error">No se pudo cargar tu portal. Intenta de nuevo mas tarde.</div>';
    return;
  }
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function esc(s) {
    return (s == null ? "" : String(s)).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function menuRowHtml(item) {
    item = item || {};
    return (
      '<div class="pv-menu-row">' +
      '<input type="text" class="pv-menu-name" placeholder="Platillo" value="' + esc(item.name) + '">' +
      '<input type="text" class="pv-menu-price" placeholder="Precio" value="' + esc(item.price) + '">' +
      '<input type="text" class="pv-menu-desc" placeholder="Descripcion (opcional)" value="' + esc(item.desc) + '">' +
      '<button type="button" data-rm-row aria-label="Quitar">&times;</button>' +
      "</div>"
    );
  }

  function readMenuRows(el) {
    var rows = [];
    el.querySelectorAll(".pv-menu-row").forEach(function (row) {
      var name = row.querySelector(".pv-menu-name").value.trim();
      var price = row.querySelector(".pv-menu-price").value.trim();
      var desc = row.querySelector(".pv-menu-desc").value.trim();
      if (name || price || desc) rows.push({ name: name, price: price, desc: desc });
    });
    return rows;
  }

  function uploadPath(file) {
    var ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
    return token.slice(0, 10) + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
  }

  async function uploadImage(file) {
    var path = uploadPath(file);
    var res = await sb.storage.from("site-images").upload(path, file, { upsert: true, cacheControl: "3600", contentType: file.type || undefined });
    if (res.error) throw res.error;
    return sb.storage.from("site-images").getPublicUrl(path).data.publicUrl;
  }

  function render(site) {
    site = site || {};
    var gallery = Array.isArray(site.gallery) ? site.gallery : [];
    var menu = Array.isArray(site.menu) ? site.menu : [];

    mount.innerHTML =
      '<div class="pv-card">' +
        "<h2>Bienvenido" + (site.restaurant_name ? ", " + esc(site.restaurant_name) : "") + "</h2>" +
        '<div class="pv-hint">Este es tu sitio. Edita lo que quieras y da clic en Guardar — se actualiza al instante.' +
        (site.subdomain ? ' Tu sitio: <a class="pv-live-link" href="https://' + esc(site.subdomain) + '.thetryla.com" target="_blank">' + esc(site.subdomain) + ".thetryla.com</a>" : "") +
        "</div>" +
        '<div class="pv-field"><label>Nombre del restaurante</label><input type="text" id="pvName" value="' + esc(site.restaurant_name) + '"></div>' +
        '<div class="pv-field"><label>Eslogan</label><input type="text" id="pvTagline" value="' + esc(site.tagline) + '"></div>' +
        '<div class="pv-field"><label>Descripcion</label><textarea id="pvDescription" rows="3">' + esc(site.description) + "</textarea></div>" +
      "</div>" +

      '<div class="pv-card">' +
        "<h2>Fotos</h2>" +
        '<div class="pv-field"><label>Logo</label><input type="file" id="pvLogoFile" accept="image/*">' +
          (site.logo_url ? '<div class="pv-thumb"><img src="' + esc(site.logo_url) + '"> actual</div>' : "") +
        "</div>" +
        '<div class="pv-field"><label>Foto principal (hero)</label><input type="file" id="pvHeroFile" accept="image/*">' +
          (site.hero_image_url ? '<div class="pv-thumb"><img src="' + esc(site.hero_image_url) + '"> actual</div>' : "") +
        "</div>" +
        '<div class="pv-field"><label>Galeria (puedes elegir varias)</label><input type="file" id="pvGalleryFile" accept="image/*" multiple>' +
          (gallery.length ? '<div class="pv-gallery-preview">' + gallery.map(function (u) { return '<img src="' + esc(u) + '">'; }).join("") + "</div>" : "") +
        "</div>" +
      "</div>" +

      '<div class="pv-card">' +
        "<h2>Menu</h2>" +
        '<div id="pvMenuRows">' + (menu.length ? menu.map(menuRowHtml).join("") : menuRowHtml()) + "</div>" +
        '<button type="button" class="pv-add-row" id="pvAddMenuRow">+ Agregar platillo</button>' +
      "</div>" +

      '<div class="pv-card">' +
        "<h2>Contacto</h2>" +
        '<div class="pv-row">' +
          '<div class="pv-field"><label>Telefono</label><input type="text" id="pvPhone" value="' + esc(site.phone) + '"></div>' +
          '<div class="pv-field"><label>Correo</label><input type="email" id="pvEmail" value="' + esc(site.email) + '"></div>' +
        "</div>" +
        '<div class="pv-row">' +
          '<div class="pv-field"><label>Direccion / ubicacion</label><input type="text" id="pvAddress" value="' + esc(site.address) + '"></div>' +
          '<div class="pv-field"><label>Horario</label><input type="text" id="pvHours" value="' + esc(site.hours) + '"></div>' +
        "</div>" +
        '<div class="pv-row">' +
          '<div class="pv-field"><label>Instagram</label><input type="text" id="pvInstagram" value="' + esc(site.instagram) + '"></div>' +
          '<div class="pv-field"><label>Facebook</label><input type="text" id="pvFacebook" value="' + esc(site.facebook) + '"></div>' +
          '<div class="pv-field"><label>TikTok</label><input type="text" id="pvTiktok" value="' + esc(site.tiktok) + '"></div>' +
        "</div>" +
      "</div>" +

      '<div class="pv-card">' +
        '<div class="pv-publish"><input type="checkbox" id="pvPublished"' + (site.published ? " checked" : "") + "> <label for=\"pvPublished\">Publicado (visible al publico)</label></div>" +
        '<div class="pv-save-row">' +
          '<button type="button" class="pv-btn" id="pvSaveBtn">Guardar cambios</button>' +
          '<span class="pv-msg" id="pvMsg"></span>' +
        "</div>" +
      "</div>";

    var newLogoUrl = site.logo_url || null;
    var newHeroUrl = site.hero_image_url || null;
    var newGallery = gallery.slice();

    document.getElementById("pvAddMenuRow").addEventListener("click", function () {
      document.getElementById("pvMenuRows").insertAdjacentHTML("beforeend", menuRowHtml());
    });
    document.getElementById("pvMenuRows").addEventListener("click", function (e) {
      if (e.target.closest("[data-rm-row]")) e.target.closest(".pv-menu-row").remove();
    });

    document.getElementById("pvSaveBtn").addEventListener("click", async function () {
      var btn = this;
      var msg = document.getElementById("pvMsg");
      btn.disabled = true;
      msg.className = "pv-msg";
      msg.textContent = "Guardando...";
      try {
        var logoFile = document.getElementById("pvLogoFile").files[0];
        var heroFile = document.getElementById("pvHeroFile").files[0];
        var galleryFiles = document.getElementById("pvGalleryFile").files;
        if (logoFile) newLogoUrl = await uploadImage(logoFile);
        if (heroFile) newHeroUrl = await uploadImage(heroFile);
        if (galleryFiles && galleryFiles.length) {
          for (var i = 0; i < galleryFiles.length; i++) newGallery.push(await uploadImage(galleryFiles[i]));
        }
        var payload = {
          restaurant_name: document.getElementById("pvName").value.trim(),
          tagline: document.getElementById("pvTagline").value.trim(),
          description: document.getElementById("pvDescription").value.trim(),
          logo_url: newLogoUrl,
          hero_image_url: newHeroUrl,
          gallery: newGallery,
          menu: readMenuRows(document.getElementById("pvMenuRows")),
          phone: document.getElementById("pvPhone").value.trim(),
          email: document.getElementById("pvEmail").value.trim(),
          address: document.getElementById("pvAddress").value.trim(),
          hours: document.getElementById("pvHours").value.trim(),
          instagram: document.getElementById("pvInstagram").value.trim(),
          facebook: document.getElementById("pvFacebook").value.trim(),
          tiktok: document.getElementById("pvTiktok").value.trim(),
          published: document.getElementById("pvPublished").checked,
        };
        var res = await sb.rpc("save_site_by_portal_token", { p_token: token, p_site: payload });
        if (res.error) throw res.error;
        msg.textContent = "Guardado.";
        render(res.data);
      } catch (err) {
        msg.className = "pv-msg err";
        msg.textContent = "No se pudo guardar: " + (err.message || err);
      } finally {
        btn.disabled = false;
      }
    });
  }

  sb.rpc("get_site_by_portal_token", { p_token: token })
    .then(function (res) {
      if (res.error) throw res.error;
      render(res.data);
    })
    .catch(function () {
      mount.innerHTML = '<div class="pv-error">Este link de portal ya no es valido. Contacta a tu asesor de Tryla.</div>';
    });
})();
</script>
</body>
</html>
